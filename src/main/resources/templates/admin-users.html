<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>User management | Sweet Moments Bakery</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body class="app-page">
<header class="topbar"><a class="brand" th:href="@{/dashboard}"><span class="brand-icon">✿</span> Sweet Moments Bakery</a><nav class="topnav"><a th:href="@{/dashboard}">Dashboard</a><a th:href="@{/profile}">My profile</a><a class="active" th:href="@{/admin/users}">User management</a><form th:action="@{/logout}" method="post"><button class="link-button" type="submit">Sign out ↗</button></form></nav></header>
<main class="page-container"><div class="page-heading"><p class="eyebrow">ADMIN TOOLS</p><h1>User management</h1></div>
  <div class="alert success" th:if="${message}" th:text="${message}"></div>
  <section class="panel"><form class="search-form" th:action="@{/admin/users}" method="get"><input type="search" name="q" th:value="${query}" placeholder="Search by name or email" aria-label="Search users"><button class="button primary" type="submit">Search</button><a class="button outline" th:href="@{/admin/users}">Clear</a></form>
  <div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Phone</th><th>Action</th></tr></thead><tbody><tr th:each="person : ${users}"><td th:text="${person.name}">Person</td><td th:text="${person.email}">person@example.com</td><td><span class="role-chip" th:text="${person.role}">CUSTOMER</span></td><td th:text="${#strings.isEmpty(person.phone) ? '—' : person.phone}">—</td><td><form th:if="${person.id != user.id}" th:action="@{/admin/users/{id}/delete(id=${person.id})}" method="post" onsubmit="return confirm('Delete this account from the demo file?');"><button class="button danger small-button" type="submit">Delete</button></form><span th:if="${person.id == user.id}" class="muted small">Current account</span></td></tr><tr th:if="${#lists.isEmpty(users)}"><td colspan="5" class="empty-state">No users match that search.</td></tr></tbody></table></div>
  <p class="muted small table-foot" th:text="${users.size() + ' account(s) shown'}">0 accounts shown</p></section>
</main></body></html>
